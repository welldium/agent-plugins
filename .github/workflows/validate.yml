name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repo checks (JSON, matching versions, no secrets)
        run: node scripts/check.mjs

      - name: Claude Code marketplace and plugins
        run: npx --yes @anthropic-ai/claude-code plugin validate .
