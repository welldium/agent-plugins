name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version-bump check diffs against the base branch

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Repo checks (JSON, matching versions, OpenAI limits, no secrets)
        run: node scripts/check.mjs

      - name: Claude Code marketplace and plugins
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Changed plugins have a higher version
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs origin/${{ github.base_ref }}

      - name: Build OpenAI submission ZIPs
        run: node scripts/build-openai.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: openai-plugins
          path: dist/*.zip
          retention-days: 14
