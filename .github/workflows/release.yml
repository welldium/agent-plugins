name: Release

# Push a tag `<plugin>--v<version>` (e.g. `claude plugin tag --push` from the plugin folder, or
# `git tag welldium--v1.0.1 && git push origin welldium--v1.0.1`). This workflow checks that the
# tag matches the plugin's manifests, builds the OpenAI submission ZIP and creates a DRAFT
# GitHub release with it attached. Review the draft, then publish it and upload the ZIP to OpenAI.
#
# Tags don't decide what Claude Code / Codex users get: our marketplaces and Anthropic's directory
# read `main`, and ship a plugin when its `version` goes up there.

on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate
        run: |
          node scripts/check.mjs
          npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Tag matches the plugin version
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="${tag%%--v*}"
          version="${tag##*--v}"
          manifest="plugins/${name}/.claude-plugin/plugin.json"
          [ -f "$manifest" ] || { echo "::error::No plugin '${name}' for tag ${tag}"; exit 1; }
          actual=$(jq -r .version "$manifest")
          [ "$actual" = "$version" ] || { echo "::error::Tag says ${version}, ${manifest} says ${actual}"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build OpenAI ZIP
        run: node scripts/build-openai.mjs "${{ steps.tag.outputs.name }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git fetch -q --tags
          prev=$(git tag --list "${NAME}--v*" --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          gh release create "${GITHUB_REF_NAME}" "dist/${NAME}-${VERSION}-openai.zip" \
            --draft \
            --title "${NAME} ${VERSION}" \
            --generate-notes \
            ${prev:+--notes-start-tag "$prev"}
